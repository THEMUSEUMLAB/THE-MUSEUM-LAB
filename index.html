<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>THE MUSEUM LAB</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    a {
      display: block;
      width: 100%;
      height: 100%;
    }

    img {
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      object-fit: cover;
      object-position: center;
    }
  </style>
</head>
<body>
  <a href="https://www.leeumstore.org/">
    <picture>
      <source media="(orientation: portrait)" srcset="main-mobile.jpg">
      <img src="main.jpg.jpg" alt="THE MUSEUM LAB">
    </picture>
  </a>
</body>
</html>
